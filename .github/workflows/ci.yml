name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm: the repository ships a pnpm-lock.yaml, and pnpm is what
      # the DSH CLI itself uses to install plugins. Asking setup-node to cache
      # npm here fails the job outright, because there is no package-lock.json
      # to hash.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the client artifact
        run: pnpm run build

      # The artifact is generated. If a build on a clean checkout differs from
      # the committed file, the template and the bundle have drifted apart, and
      # the committed copy is what the shell would serve.
      - name: Check that the committed artifact matches the template
        run: |
          if ! git diff --quiet -- lib/client.js; then
            echo "::error::lib/client.js is out of date; run 'pnpm run build' and commit the result"
            git --no-pager diff --stat -- lib/client.js
            exit 1
          fi
          echo "the committed artifact matches the template"

      - name: Verify
        run: pnpm test

      # On a release tag, verify what a user actually downloads rather than the
      # working tree.
      #
      # A release does not imply the npm channel carries it: 0.2.0 was released as
      # a tarball because npm requires a stronger 2FA factor to approve a staged
      # publish than the account has, so the registry may legitimately lag the
      # tag. Ask the registry first and say so plainly, instead of failing a
      # release that was distributed by another channel.
      - name: Is this version on npm?
        if: startsWith(github.ref, 'refs/tags/v')
        id: npm_has_version
        run: |
          version=$(node -p "require('./package.json').version")
          if curl -sfI "https://registry.npmjs.org/dsh-ipynb-preview/-/dsh-ipynb-preview-$version.tgz" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "npm has $version"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::npm has no tarball for $version yet; skipping the registry check. This release is distributed by tarball."
          fi

      - name: Check the published tarball
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm_has_version.outputs.present == 'true'
        run: pnpm run check-published
